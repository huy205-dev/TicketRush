# TicketRush front door (SPEC.md 3): one origin for the browser, so the
# frontend needs no CORS. /v1/queue/* goes to the waiting room, everything
# else to booking. Both run on the host (make run-booking, make
# run-waitingroom); open http://localhost:8000.

# Per-IP rate limits for the two endpoints a crowd hammers (SPEC.md M5).
# Load tests call booking directly on :8080 and are not limited.
limit_req_zone $binary_remote_addr zone=orders:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=join:10m rate=2r/s;
limit_req_status 429;

upstream booking {
  server host.docker.internal:8080;
  keepalive 32;
}

upstream waitingroom {
  server host.docker.internal:8081;
  keepalive 32;
}

server {
  listen 80;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # The services log it as request_id.
  proxy_set_header X-Request-Id $request_id;

  location = /v1/orders {
    limit_req zone=orders burst=20 nodelay;
    proxy_pass http://booking;
  }

  location ~ ^/v1/queue/[^/]+/join$ {
    limit_req zone=join burst=5 nodelay;
    proxy_pass http://waitingroom;
  }

  # Server-Sent Events: pass every event through at once and keep the
  # connection open while the buyer waits.
  location ~ ^/v1/queue/[^/]+/stream$ {
    proxy_pass http://waitingroom;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /v1/queue/ {
    proxy_pass http://waitingroom;
  }

  location / {
    proxy_pass http://booking;
  }
}
